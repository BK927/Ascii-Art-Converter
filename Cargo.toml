[workspace]
members = ["crates/aa-core", "crates/aa-egui", "crates/aa-cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BK927/Ascii-Art-Converter"

[workspace.dependencies]
aa-core = { path = "crates/aa-core" }
eframe = "0.33"
egui = "0.33"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "tiff", "webp"] }
imageproc = "0.25"
rayon = "1.11"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ttf-parser = "0.25"
